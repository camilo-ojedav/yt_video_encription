# Sitio estatico: la raiz es web/. Ejemplo para nginx (el certificado con: certbot --nginx -d video.shard.icu)
server {
    listen 80;
    server_name video.shard.icu;
    root /var/www/yt_video_encription/web;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; }
    location /media/ { add_header Cache-Control "no-cache"; }
    types { application/octet-stream bin; }
    include /etc/nginx/mime.types;
}
